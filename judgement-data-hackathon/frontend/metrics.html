<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Team Metrics — by F1</title>
<style>
  :root { --bg:#0f1117; --card:#181b23; --line:#2a2f3c; --text:#e8eaf0; --muted:#9aa1b2; --accent:#5b8cff; --ok:#3fbf7f; --bad:#e5646c; }
  * { box-sizing:border-box; margin:0; }
  body { font:15px/1.5 -apple-system, "Segoe UI", sans-serif; background:var(--bg); color:var(--text); padding:2rem 1rem; }
  .wrap { max-width:1100px; margin:0 auto; display:grid; gap:1.5rem; }
  h1 { font-size:1.4rem; }
  a { color:var(--accent); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:1.25rem; }
  .scroll { overflow-x:auto; }
  table { width:100%; border-collapse:collapse; font-size:.88rem; white-space:nowrap; }
  th, td { padding:.5rem .7rem; text-align:left; border-bottom:1px solid var(--line); }
  th { color:var(--muted); font-weight:600; font-size:.78rem; text-transform:uppercase; letter-spacing:.04em; }
  .hint { font-size:.8rem; color:var(--muted); }
  nav a { margin-right:1rem; }
</style>
</head>
<body>
<div class="wrap">
  <h1>📊 Team-Reported Metrics <span class="hint">— from each team's uploaded metrics.csv, sorted by their F1 (self-reported, not verified by us)</span></h1>
  <nav class="hint">
    <a href="/?admin=1">← Leaderboard</a>
    <a href="/notebooks.html">Notebooks</a>
    <a href="/custom-eval.html">Custom evaluation</a>
  </nav>
  <div class="card">
    <div class="scroll"><table>
      <thead id="head"></thead>
      <tbody id="body"><tr><td>Loading…</td></tr></tbody>
    </table></div>
  </div>
</div>
<script src="/preview.js"></script>
<script>
const API = window.API = localStorage.getItem('apiBase')
  || (!location.port || location.port === '80' || location.port === '443' ? ''
      : `http://${location.hostname || 'localhost'}:${location.hostname === 'localhost' || !location.hostname ? 8000 : 8001}`);
const esc = t => (t||'').replaceAll('&','&amp;').replaceAll('<','&lt;');
// only show recognized metric names — some teams uploaded non-metric CSVs whose columns would pollute the table
const PREFERRED = ['accuracy', 'precision', 'recall', 'f1', 'specificity', 'roc_auc', 'tp', 'fp', 'tn', 'fn'];

fetch(API + '/api/team-metrics').then(r => r.json()).then(rows => {
  const keys = PREFERRED.filter(k => rows.some(r => k in r.metrics));
  rows.sort((a, b) => (b.metrics.f1 ?? -1) - (a.metrics.f1 ?? -1));
  document.getElementById('head').innerHTML = `<tr><th>#</th><th>Team</th><th>Submission ID</th>
    ${keys.map(k => `<th${k === 'f1' ? ' style="color:var(--accent)"' : ''}>${esc(k)}</th>`).join('')}
    <th>metrics.csv</th></tr>`;
  document.getElementById('body').innerHTML = rows.length ? rows.map((r, i) => `
    <tr><td>${i + 1}</td><td>${esc(r.team_name)}</td><td class="hint">${r.id}</td>
    ${keys.map(k => `<td${k === 'f1' ? ' style="font-weight:700"' : ''}>${r.metrics[k] != null ? Number(r.metrics[k]).toFixed(4) : '—'}</td>`).join('')}
    <td><a href="javascript:void(0)" onclick="previewFile('${r.id}','metrics','${esc(r.team_name).replaceAll("'","")} — metrics.csv')">👁 preview</a></td></tr>`).join('')
    : '<tr><td>No submissions.</td></tr>';
}).catch(() => document.getElementById('body').innerHTML = '<tr><td>Cannot reach API.</td></tr>');
</script>
</body>
</html>
